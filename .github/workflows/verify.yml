name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore KernelMK.slnx
      - run: dotnet build KernelMK.slnx --no-restore -c Release
      - run: dotnet test KernelMK.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: TestResults/*.trx
